pluginManagement {
    repositories {
        // 优先走阿里云镜像，国内下载速度有保障；找不到再回落 Google/Maven Central
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google {
            content {
                includeGroupByRegex "com\\.android.*"
                includeGroupByRegex "com\\.google.*"
                includeGroupByRegex "androidx.*"
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) // 强制所有模块统一用这里的仓库
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

rootProject.name = "AASplitBill"

// 壳模块
include ':app'

// 功能模块（feature 层）
include ':feature-auth'
include ':feature-friends'
include ':feature-bill'
include ':feature-group'
include ':feature-settlement'
include ':feature-membership'

// 核心模块（core 层）
include ':core-common'
include ':core-network'
include ':core-database'
include ':core-ocr'

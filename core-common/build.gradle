plugins {
    alias(libs.plugins.android.library)   // 注意：库模块用 library 插件，不是 application
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)                // core-common 若未来要放 Hilt 供给方，KSP 先留着
    alias(libs.plugins.hilt)
}

android {
    namespace 'com.zc.aasplitbill.core.common'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro' // 给下游模块的混淆规则

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false // 库模块不做混淆，混淆统一在 app 壳模块做
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ============ Android 基础 ============
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat

    // ============ 协程 ============
    api libs.coroutines.core       // api：core-common 对外暴露 suspend 函数，下游必须传递
    api libs.coroutines.android

    // ============ Hilt（本模块提供公共 DI 供给，如 Dispatchers 限定符） ============
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // ============ 测试 ============
    testImplementation libs.junit
    testImplementation libs.coroutines.test
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.espresso.core
}
